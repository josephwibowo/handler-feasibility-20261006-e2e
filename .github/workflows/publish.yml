name: Synthetic real checks and child revision
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [check, revise-child, update-child-base]
        default: check
permissions:
  contents: write
  pull-requests: write
  statuses: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check exact synthetic candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$OPERATION" = revise-child ]; then
            git checkout codex/synthetic-b
            printf 'synthetic-b-v2\n' > b.txt
            git add b.txt
            git commit -m 'Synthetic child corrected candidate'
            git -c credential.helper='!gh auth git-credential' push origin codex/synthetic-b
          fi
          if [ "$OPERATION" = update-child-base ]; then
            git checkout codex/synthetic-b
            git merge --no-edit origin/main
            git -c credential.helper='!gh auth git-credential' push origin codex/synthetic-b
          fi
          for branch in codex/synthetic-a codex/synthetic-b; do
            git checkout "$branch"
            SHA=$(git rev-parse HEAD)
            STATUS=success
            if [ "$branch" = codex/synthetic-a ]; then
              test "$(cat a.txt)" = synthetic-a-v1 || STATUS=failure
            else
              test "$(cat a.txt)" = synthetic-a-v1 || STATUS=failure
              test "$(cat b.txt)" = synthetic-b-v2 || STATUS=failure
            fi
            printf '%s %s actual_behavior=%s\n' "$branch" "$SHA" "$STATUS"
            gh api "repos/$GH_REPO/statuses/$SHA" -f state="$STATUS" -f context=synthetic-behavior -f description="Actual synthetic file assertion: $STATUS" -f target_url="https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          done
